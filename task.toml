schema_version = "2.0"
artifacts = [
    { source = "/app/authfuzzer", exclude = ["__pycache__", "*.pyc"] },
]

[task]
name = "security/stateful-api-auth-fuzzer"
description = "Build a stateful differential fuzzer that discovers authorization inconsistencies, IDORs, and privilege escalations in multi-tenant APIs, minimizing failure sequences."

[metadata]
category = "cybersecurity"
difficulty = "hard"
tags = ["red-teaming", "differential-fuzzing", "access-control", "idor", "stateful-testing", "delta-debugging"]

[agent]
timeout_sec = 72000.0
user = "agent"

[verifier]
timeout_sec = 600.0
environment_mode = "separate"
user = "root"

[environment]
build_timeout_sec = 600.0
cpus = 4
memory_mb = 4096
storage_mb = 4096
gpus = 0
network_mode = "no-network"
