[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "authfuzzer"
version = "0.1.0"
description = "Stateful Differential Fuzzer for Multi-Tenant API Authorization"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["authfuzzer*", "api*"]
